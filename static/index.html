<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NSE S/R Screener</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="topbar">
      <span class="title">NSE&nbsp;·&nbsp;S/R Screener</span>
      <div class="tf-toggle" id="tf-toggle">
        <button data-tf="1d" class="active">1D</button>
        <button data-tf="1w">1W</button>
        <button data-tf="1m">1M</button>
      </div>
      <span class="spacer"></span>
      <span class="generated" id="generated"></span>
      <span class="count" id="count"></span>
    </div>

    <div id="main">
      <div id="left">
        <div id="filter-bar">
          <label>&Delta;ATR &le;<input type="number" id="f-datr" step="0.1" min="0"></label>
          <label>Touch &ge;<input type="number" id="f-touch" step="1" min="1"></label>
          <label>Conf &ge;<input type="number" id="f-conf" step="1" min="0" max="100"></label>
          <label>&#8377;cr &ge;<input type="number" id="f-turn" step="1" min="0"></label>
          <div class="chips" id="f-type">
            <button data-t="All" class="active">All</button>
            <button data-t="Support Reversal">Support&nbsp;Rev</button>
            <button data-t="Resistance Reversal">Resistance&nbsp;Rev</button>
            <button data-t="Breakouts">Breakouts</button>
          </div>
          <span class="spacer"></span>
          <span class="shown" id="shown-count"></span>
        </div>
        <div id="list-scroll">
          <table class="list">
            <thead id="list-head"></thead>
            <tbody id="list-body"></tbody>
          </table>
          <div class="empty" id="list-empty" style="display:none"></div>
        </div>
      </div>

      <div id="right">
        <div id="chart-header">
          <span class="h-meta" id="chart-header-text">Select a stock from the list.</span>
          <span class="spacer"></span>
          <div class="tf-toggle" id="chart-type-toggle">
            <button data-ct="candles" class="active">Candles</button>
            <button data-ct="line">Line</button>
          </div>
        </div>
        <div id="chart"></div>
      </div>
    </div>
  </div>

  <script src="vendor/lightweight-charts.standalone.production.js"></script>
  <script src="app.js"></script>
</body>
</html>
