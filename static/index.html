<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NSE Screener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <div id="app">
    <div id="topbar">
      <div class="brand"><i></i>NSE Screener</div>
      <div class="seg" id="mode-toggle">
        <button data-mode="sr" class="active">Trendlines</button>
        <button data-mode="bo">Breakouts</button>
      </div>
      <div class="seg sm" id="tf-toggle">
        <button data-tf="1d" class="active">Daily</button>
        <button data-tf="1w">Weekly</button>
        <button data-tf="1m">Monthly</button>
      </div>
      <span class="spacer"></span>
      <a class="tlink" id="bt-link" href="backtest.html" style="display:none">Backtest &#8599;</a>
      <span class="stamp" id="generated"></span>
    </div>

    <div id="main">
      <div id="left" class="card">
        <div id="filters"></div>
        <div id="list-scroll">
          <table class="list"><thead id="list-head"></thead><tbody id="list-body"></tbody></table>
          <div class="empty" id="list-empty" style="display:none"></div>
        </div>
      </div>
      <div id="right">
        <div id="info" class="card"><span class="muted">Select a stock from the list.</span></div>
        <div id="chartcard" class="card">
          <div class="seg sm" id="ct">
            <button data-ct="candles" class="active">Candles</button>
            <button data-ct="line">Line</button>
          </div>
          <div id="chart"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="vendor/lightweight-charts.standalone.production.js"></script>
  <script src="app.js"></script>
</body>
</html>
