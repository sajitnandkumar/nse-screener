<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NSE Screener · Backtest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="ui.css">
  <style>
    html, body { overflow: auto; }
    #app { height: auto; min-height: 100vh; }
    #page { max-width: 1180px; margin: 0 auto; padding: 20px 18px 60px; display: flex; flex-direction: column; gap: 18px; }
    .card { padding: 18px 20px; }
    h2 { font-size: 15px; font-weight: 650; margin: 0 0 4px; letter-spacing: -.01em; }
    .lead { color: var(--muted); font-size: 13.5px; line-height: 1.55; margin: 0 0 14px; max-width: 820px; }
    .lead b, .say b { color: var(--ink); }
    .say { font-size: 14px; line-height: 1.6; padding: 12px 14px; background: var(--surface2); border-left: 3px solid var(--accent); border-radius: 6px; }
    .ctl { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .ctl input.dt { background: var(--bg); border: 1px solid var(--border); color: var(--ink); border-radius: 7px; padding: 5px 8px; font-size: 12.5px; color-scheme: dark; }
    .ctl input.dt:focus { outline: none; border-color: var(--accent); }
    .ctl .lbl { color: var(--muted); font-size: 13px; }
    .grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .verdict.thin { opacity: .5; }
    .tiles.three .tile .v { font-size: 14px; }
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 14px; }
    .verdict { display: flex; flex-direction: column; gap: 12px; }
    .verdict .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .verdict .head .t { font-weight: 600; font-size: 15px; }
    .verdict .head .n { color: var(--dim); font-size: 12px; }
    .big { font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
    .big + .k { color: var(--dim); font-size: 12px; margin-top: 4px; }
    .tiles.three { grid-template-columns: repeat(3, 1fr); }
    /* bar tables */
    table.bt { width: 100%; border-collapse: collapse; }
    table.bt th { color: var(--dim); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
    table.bt td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--border2); white-space: nowrap; }
    table.bt th.l, table.bt td.l { text-align: left; }
    table.bt tr.click { cursor: pointer; }
    table.bt tr.click:hover td { background: var(--hover); }
    table.bt tr.sel td { background: var(--accent-bg); }
    table.bt tr.thin td { opacity: .45; }
    table.bt tr.grp td { color: var(--muted); font-weight: 600; padding-top: 14px; border-bottom: 1px solid var(--border); }
    .hbar { display: inline-block; width: 90px; height: 6px; border-radius: 3px; background: var(--surface2); vertical-align: middle; margin-right: 8px; overflow: hidden; }
    .hbar b { display: block; height: 100%; background: var(--accent); }
    .hint { color: var(--dim); font-size: 12px; margin-top: 10px; line-height: 1.5; }
    /* drill */
    #drill-wrap { display: grid; grid-template-columns: minmax(360px, 42%) 1fr; gap: 14px; }
    #drill-list { max-height: 400px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; }
    #drill-list table.bt th { position: sticky; top: 0; background: var(--surface); z-index: 1; }
    #drill-empty { padding: 24px; color: var(--dim); text-align: center; }
    #drill-hdr { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; min-height: 26px; }
    #drill-hdr .sym { font-size: 16px; }
    #drill-chart { height: 360px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    ul.plain { margin: 0; padding-left: 18px; color: var(--muted); line-height: 1.7; }
    ul.plain b { color: var(--ink); }
    @media (max-width: 900px) { #drill-wrap, .grid4 { grid-template-columns: 1fr; } .tiles.three { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <div class="brand"><i></i>NSE Screener <span class="muted" style="font-weight:400">· Backtest</span></div>
      <a class="tlink" href="index.html">&larr; Back to screener</a>
      <span class="spacer"></span>
      <span class="stamp" id="stamp"></span>
    </div>

    <div id="page">
      <div class="card">
        <div class="ctl">
          <h2 style="margin:0" id="intro">Do trendline setups work?</h2>
          <span class="spacer"></span>
          <span class="lbl">From</span><input type="date" id="d-from" class="dt">
          <span class="lbl">to</span><input type="date" id="d-to" class="dt">
          <span class="lbl" style="margin-left:10px" title="A candle is one day, week or month — whichever chart the setup came from">Look ahead</span>
          <div class="seg sm" id="c-h"></div>
        </div>
      </div>

      <div class="grid4" id="verdicts"></div>

      <div class="card">
        <h2>Does confidence matter?</h2>
        <div class="grid2" id="conf-wrap"></div>
        <div class="say" id="conf-say"></div>
      </div>

      <div class="card">
        <h2>By timeframe, line &amp; touches</h2>
        <table class="bt" id="slices"></table>
      </div>

      <div class="card" id="drill">
        <h2 id="drill-title">Cases</h2>
        <div id="drill-wrap">
          <div id="drill-list"><div id="drill-empty">Click any row above to list its cases.</div><table class="bt" id="drill-table" style="display:none"><thead><tr><th class="l">Stock</th><th class="l">Date</th><th>Conf</th><th>Outcome</th><th id="drill-mv-th">Move</th></tr></thead><tbody id="drill-body"></tbody></table></div>
          <div>
            <div id="drill-hdr"><span class="muted">Click a case to see its chart.</span></div>
            <div id="drill-chart"></div>
          </div>
        </div>
      </div>

      <details class="card">
        <summary style="cursor:pointer;font-weight:600">How this was measured</summary>
        <ul class="plain" id="method" style="margin-top:10px"></ul>
      </details>
    </div>
  </div>
  <script src="vendor/lightweight-charts.standalone.production.js"></script>
  <script src="backtest.js"></script>
</body>
</html>
