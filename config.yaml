# Screener tuning — hull-based engine. All distances are in ATR (volatility-
# normalised) so a threshold means the same across stocks. Everything is measured
# on CLOSING prices. Only the knobs the live engine reads live here.

# ---------------------------------------------------------------------------
# Hull line detection (hull_lines.py). Lower-hull edges = support, upper-hull
# edges = resistance; between a line's two anchors no close is ever on the wrong
# side (exact by construction — no filtering). See CLAUDE.md Slice 22.
# ---------------------------------------------------------------------------
hull:
  touch_tol_atr: 0.25       # a close within this many ATR of the line = a touch
  min_touches: 6            # keep a line only if tested at least this many times
  recency_days: 10          # most recent touch must be within this many CALENDAR days
  atr_window: 14
  horizontal_total_atr: 0.5 # line's total price change over its DRAWN extent (first
                            # anchor -> now), in ATR. Below => "horizontal" (flat);
                            # else "trendline". Span-correct for short-steep & long-gentle.
  lookback:                 # trailing window per timeframe (bars); null = full history
    1d: 750                 # ~3 years of daily
    1w: null
    1m: null

# Where price sits vs the line now: within this many ATR of the line = "on the
# line" -> labelled a Reversal (a hair past is a test, not a decisive break).
on_line_atr: 0.25

# CONF (0-100): a transparent line-QUALITY score — "how good and proven is this
# line", NOT a trade prediction. Four independent 0-1 components, weighted.
# Proximity (dist_atr) and volume are deliberately EXCLUDED (own columns).
#   CONF = 100 * (w_touch*touch + w_fit*fit + w_span*span + w_recency*recency)
confidence:
  weight_touch: 0.35
  weight_fit: 0.35
  weight_span: 0.15
  weight_recency: 0.15
  touch_cap: 10       # touches at/above this = full touch_score
  fit_cap: 0.25       # avg touch dist (ATR) at/above this = 0 fit_score (= hull.touch_tol_atr)
  span_cap_days: 365  # touch-span in CALENDAR DAYS at/above this = full span_score
                      # (uniform across timeframes — no 1D/1W/1M bias)
  recency_window: 14  # days over which recency_score decays 1 -> 0

# Tradeability layer on top of the clean geometry (screener.py).
reliability:
  # LIQUIDITY GATE (biggest reliability lever). Average daily traded VALUE
  # (close x volume) over the last turnover_lookback DAILY bars must clear the
  # floor. Value, not share-count, so it's fair across a cheap and a costly stock.
  min_turnover_cr: 2.0      # rupees crore/day backend gate; 0 disables. The UI
                            # turnover filter defaults higher (5cr) but can dial
                            # down to this floor to reveal smaller names.
  turnover_lookback: 20

  # VOLUME context column (Vol x). Recent = MAX volume over the last few bars
  # (robust to a partial current weekly/monthly bar) / the trailing average.
  # NOT part of CONF — shown as its own column.
  vol_recent_bars: 3
  vol_base_bars: 20
