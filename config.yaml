# Screener tuning — hull-based engine. All distances are in ATR (volatility-
# normalised) so a threshold means the same across stocks. Everything is measured
# on CLOSING prices. Only the knobs the live engine reads live here.

# ---------------------------------------------------------------------------
# Hull line detection (hull_lines.py). Lower-hull edges = support, upper-hull
# edges = resistance; between a line's two anchors no close is ever on the wrong
# side (exact by construction — no filtering). See CLAUDE.md Slice 22.
# ---------------------------------------------------------------------------
hull:
  touch_tol_atr: 0.25       # a close within this many ATR of the line = a touch
  min_touches: 6            # keep a line only if tested at least this many times
  recency_days: 10          # most recent touch must be within this many CALENDAR days
  atr_window: 14
  horizontal_total_atr: 0.5 # line's total price change over its DRAWN extent (first
                            # anchor -> now), in ATR. Below => "horizontal" (flat);
                            # else "trendline". Span-correct for short-steep & long-gentle.
  max_travel_atr: 12        # reject lines that travel more than this many ATR over their
                            # extent = trend-envelope junk (ceiling/floor of a runaway move)
  lookback:                 # trailing window per timeframe (bars); null = full history
    1d: 750                 # ~3 years of daily
    1w: null
    1m: null

# Where price sits vs the line now: within this many ATR of the line = "on the
# line" -> labelled a Reversal (a hair past is a test, not a decisive break).
on_line_atr: 0.25

# CONF (0-100): a transparent line-QUALITY score — "how good and proven is this
# line", NOT a trade prediction. Four independent 0-1 components, weighted.
# Proximity (dist_atr) and volume are deliberately EXCLUDED (own columns).
#   CONF = 100 * (w_touch*touch + w_fit*fit + w_span*span + w_recency*recency)
confidence:
  weight_touch: 0.35
  weight_fit: 0.35
  weight_span: 0.15
  weight_recency: 0.15
  touch_cap: 10       # touches at/above this = full touch_score
  fit_cap: 0.25       # avg touch dist (ATR) at/above this = 0 fit_score (= hull.touch_tol_atr)
  span_cap_days: 365  # touch-span in CALENDAR DAYS at/above this = full span_score
                      # (uniform across timeframes — no 1D/1W/1M bias)
  recency_window: 14  # days over which recency_score decays 1 -> 0

# Tradeability layer on top of the clean geometry (screener.py).
reliability:
  # LIQUIDITY GATE (biggest reliability lever). Average daily traded VALUE
  # (close x volume) over the last turnover_lookback DAILY bars must clear the
  # floor. Value, not share-count, so it's fair across a cheap and a costly stock.
  min_turnover_cr: 2.0      # rupees crore/day backend gate; 0 disables. The UI
                            # turnover filter defaults higher (5cr) but can dial
                            # down to this floor to reveal smaller names.
  turnover_lookback: 20

  # VOLUME context column (Vol x). Recent = MAX volume over the last few bars
  # (robust to a partial current weekly/monthly bar) / the trailing average.
  # NOT part of CONF — shown as its own column.
  vol_recent_bars: 3
  vol_base_bars: 20

# ---------------------------------------------------------------------------
# Backtest (backtest.py). Walk-forward: at each historical as-of date the hull is
# detected only on data UP TO that date (no lookahead); when price is within
# proximity of a line, record the setup + its as-of CONF, then look forward_bars
# ahead and classify HELD (line held as a boundary) vs BROKE. Reversals only (v1).
# ---------------------------------------------------------------------------
backtest:
  proximity_atr: 0.5        # as-of, price within this ATR of the line = setup fired
  step_bars: {1d: 5, 1w: 2, 1m: 1}          # as-of sampling stride per timeframe
  min_history: {1d: 300, 1w: 120, 1m: 40}   # bars needed before the first as-of
  # REVERSAL/BREAK + FORWARD-RETURN model. At each as-of setup, look forward and record
  # (a) reversed vs broke and (b) the signed close-to-close % return at each horizon.
  return_bars: [1, 5, 14]     # forward % return horizons, in that tf's candles
  break_buffer_atr: 0.5       # a close this many ATR PAST the line (wrong side) = broke
  classify_window: 14         # bars over which reversed/broke is decided

# ---------------------------------------------------------------------------
# Breakout library (breakouts.py) — implements breakout_library.md on D/W/M bars.
# Every rule fires on a bar CLOSE beyond a level. `null` RVOL = no volume requirement.
# Cells the library doesn't define for monthly bars reuse the weekly rule (tagged
# `extrapolated` in the output).
# ---------------------------------------------------------------------------
breakouts:
  buffer: 0.001               # b: close must clear the level by 0.1%
  fresh_bars: {1d: 3, 1w: 2, 1m: 2}   # show setups that fired within the last N bars
  rvol_bars: {1d: 50, 1w: 20, 1m: 12} # RVOL = bar volume / mean of the previous N bars
  prev_hl:                    # RVOL needed for long / short
    1d: {long_rvol: 1.5, short_rvol: 1.5}
    1w: {long_rvol: 1.5, short_rvol: null}
    1m: {long_rvol: 1.5, short_rvol: null}
  cpr:
    percentile: 20            # narrow = width <= this percentile of the last `window` periods
    window: 60
    min_periods: 20
    rvol: {1d: 1.2, 1w: null, 1m: null}
  high52:
    bars: {1d: 252, 1w: 52, 1m: 12}   # lookback in that timeframe's bars
    rvol: 1.5
    invalid_pct: 3            # invalid on a close this % below the broken level
  base:
    dryup_max: 0.8            # SMA(V,short)/SMA(V,long) must be below this
    1d: {lengths: [20], depth_pct: 10, prox_pct: 5,  rvol: 1.5, dryup_bars: [10, 50]}
    1w: {lengths: [10, 14, 20, 26], depth_pct: 25, prox_pct: 10, rvol: 1.5, dryup_bars: [10, 50]}
    1m: {lengths: [6, 9, 12], depth_pct: 35, prox_pct: 15, rvol: 1.5, dryup_bars: [3, 12]}  # extrapolated
  nr7:
    rvol: {1d: 1.2, 1w: null, 1m: null}
  gap:                        # daily only
    rvol: 2.0
    size_atr: 0.5

# ---------------------------------------------------------------------------
# Moving-average crossovers (crossovers.py): price closing across an SMA / EMA.
# NOTE: monthly bars only go back to 2020 (~80 bars), so 100+ period averages
# never exist on the Monthly tab — it will be empty until the history is longer.
# ---------------------------------------------------------------------------
crossovers:
  periods: [100, 200, 220]
  fresh_bars: {1d: 3, 1w: 2, 1m: 2}    # show crosses within the last N bars
  rvol_bars: {1d: 50, 1w: 20, 1m: 12}  # volume surge lookback (same as breakouts)
