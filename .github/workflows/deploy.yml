name: Build & deploy screener

# Runs after NSE close (15:30 IST) plus a manual trigger.
# 13:00 UTC = 18:30 IST, weekdays.
on:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Persist the price database between daily runs so the fetch stays
      # incremental (the first run has no cache and does a full ~6y load).
      - name: Restore price DB
        uses: actions/cache@v4
        with:
          path: nse_data.db
          key: nse-db-${{ github.run_id }}
          restore-keys: nse-db-

      # First run has no cache -> seed the full DB from the "db-seed" release so
      # the cloud never has to cold-fetch ~2000 stocks (which Angel rate-limits).
      - name: Seed DB from release if not cached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f nse_data.db ]; then
            echo "No cached DB — downloading seed from the db-seed release ..."
            gh release download db-seed --repo "${{ github.repository }}" --pattern nse_data.db --clobber || echo "no seed release found; will fetch fresh"
          fi

      - name: Fetch data, screen, build site
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_MPIN: ${{ secrets.ANGEL_MPIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: |
          python bulk_load.py || echo "bulk_load had errors; building site from existing data"
          python build_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
